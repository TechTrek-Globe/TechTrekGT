<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Dark Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#07090f" stop-opacity="1" />
    </radialGradient>

    <!-- Metallic Shield Gradient (Gold / Bronze) -->
    <linearGradient id="shieldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="25%" stop-color="#aa771c" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#85581A" />
      <stop offset="100%" stop-color="#5B3A0D" />
    </linearGradient>

    <!-- Inner Shield Gradient (Dark Slate Steel) -->
    <linearGradient id="innerSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Sky Blue Metallic Accent -->
    <linearGradient id="skyBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Compass Gold Gradient -->
    <linearGradient id="compassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="#07090f" />
  <circle cx="400" cy="440" r="360" fill="url(#bgGlow)" />

  <!-- MAIN EMBLEM CONTAINER -->
  <g filter="url(#dropShadow)">
    
    <!-- Outer Metallic Shield Frame -->
    <path d="M 400 130 
             L 650 220 
             L 670 490 
             C 670 650 560 750 400 810 
             C 240 750 130 650 130 490 
             L 150 220 
             Z" 
          fill="url(#shieldMetal)" 
          stroke="#fef08a" 
          stroke-width="3" />

    <!-- Inner Metallic Inset Shield -->
    <path d="M 400 148 
             L 634 232 
             L 652 485 
             C 652 633 548 730 400 788 
             C 252 730 148 633 148 485 
             L 166 232 
             Z" 
          fill="url(#innerSteel)" 
          stroke="#475569" 
          stroke-width="2" />

    <!-- Circuit Board Traces & Binary Tech Details -->
    <g stroke="#0284c7" stroke-width="2" opacity="0.45" fill="none">
      <!-- Left Circuit Lines -->
      <path d="M 170 320 L 230 320 L 260 360" />
      <circle cx="170" cy="320" r="4" fill="#0284c7" />
      <path d="M 180 440 L 220 440 L 250 410" />
      <circle cx="180" cy="440" r="4" fill="#0284c7" />
      
      <!-- Right Circuit Lines -->
      <path d="M 630 320 L 570 320 L 540 360" />
      <circle cx="630" cy="320" r="4" fill="#0284c7" />
      <path d="M 620 440 L 580 440 L 550 410" />
      <circle cx="620" cy="440" r="4" fill="#0284c7" />

      <!-- Bottom Circuit Traces -->
      <path d="M 310 710 L 350 750 L 400 750" />
      <path d="M 490 710 L 450 750 L 400 750" />
      <circle cx="310" cy="710" r="4" fill="#0284c7" />
      <circle cx="490" cy="710" r="4" fill="#0284c7" />
    </g>

    <!-- Binary Code Markings -->
    <g fill="#38bdf8" opacity="0.5" font-family="monospace" font-size="14" font-weight="bold">
      <text x="185" y="380" transform="rotate(-90 185 380)">01110</text>
      <text x="205" y="420" transform="rotate(-90 205 420)">1100100</text>
      <text x="615" y="380" transform="rotate(90 615 380)">01110</text>
      <text x="595" y="420" transform="rotate(90 595 420)">1100100</text>
    </g>

    <!-- CENTRAL GLOBE & EXPLORATION DISK -->
    <g id="central-globe">
      <!-- Outer Globe Ring -->
      <circle cx="400" cy="430" r="210" fill="#0b1329" stroke="url(#skyBlueGrad)" stroke-width="6" />
      <circle cx="400" cy="430" r="200" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />

      <!-- Globe Latitude & Longitude Lines -->
      <g stroke="#0284c7" stroke-width="1.5" opacity="0.35" fill="none">
        <ellipse cx="400" cy="430" rx="190" ry="70" />
        <ellipse cx="400" cy="430" rx="190" ry="140" />
        <ellipse cx="400" cy="430" rx="70" ry="190" />
        <ellipse cx="400" cy="430" rx="140" ry="190" />
        <line x1="190" y1="430" x2="610" y2="430" />
        <line x1="400" y1="240" x2="400" y2="620" />
      </g>

      <!-- Mountain Range Silhouette inside Globe -->
      <path d="M 230 520 L 290 420 L 340 470 L 410 370 L 480 460 L 520 410 L 570 520 Z" 
            fill="#1e293b" opacity="0.75" stroke="#334155" stroke-width="2" />
      <path d="M 290 420 L 305 445 L 275 445 Z" fill="#7dd3fc" opacity="0.8" />
      <path d="M 410 370 L 430 405 L 390 405 Z" fill="#7dd3fc" opacity="0.9" />
      <path d="M 520 410 L 532 430 L 508 430 Z" fill="#7dd3fc" opacity="0.8" />

      <!-- Winding Smart Route Path (Neon Cyan / Gold Line) -->
      <path d="M 240 490 Q 310 560 380 470 T 520 440 T 560 340" 
            fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#cyanGlow)" />
      <path d="M 240 490 Q 310 560 380 470 T 520 440 T 560 340" 
            fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" />

      <!-- Waypoint Location Pins along Route -->
      <!-- Pin 1 -->
      <g transform="translate(240, 490)">
        <circle cx="0" cy="0" r="10" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
        <circle cx="0" cy="0" r="4" fill="#ffffff" />
      </g>

      <!-- Pin 2 (Center Major Pin) -->
      <g transform="translate(380, 470)" filter="url(#cyanGlow)">
        <path d="M 0 0 C -12 -12 -18 -24 -18 -34 C -18 -48 -8 -56 0 -56 C 8 -56 18 -48 18 -34 C 18 -24 12 -12 0 0 Z" 
              fill="#ef4444" stroke="#ffffff" stroke-width="2" />
        <circle cx="0" cy="-34" r="6" fill="#ffffff" />
      </g>

      <!-- Pin 3 -->
      <g transform="translate(520, 440)">
        <circle cx="0" cy="0" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
        <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
      </g>

      <!-- Ascending Airplane Flight Path & Jet Silhouette -->
      <g transform="translate(560, 340) rotate(-25)" filter="url(#cyanGlow)">
        <!-- Jet Silhouette -->
        <path d="M 0 -24 L 6 0 L 26 10 L 26 16 L 6 10 L 4 24 L 10 29 L 10 34 L 0 30 L -10 34 L -10 29 L -4 24 L -6 10 L -26 16 L -26 10 L -6 0 Z" 
              fill="url(#goldTextGrad)" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- PROMINENT 3D COMPASS ROSE (Center Overlay) -->
      <g id="compass-rose" transform="translate(400, 350)" filter="url(#dropShadow)">
        <!-- Compass Outer Ring -->
        <circle cx="0" cy="0" r="65" fill="#0f172a" stroke="url(#shieldMetal)" stroke-width="5" />
        <circle cx="0" cy="0" r="56" fill="none" stroke="#38bdf8" stroke-width="1.5" />

        <!-- Cardinal Ticks -->
        <g stroke="#fef08a" stroke-width="2">
          <line x1="0" y1="-65" x2="0" y2="-56" />
          <line x1="0" y1="65" x2="0" y2="56" />
          <line x1="-65" y1="0" x2="-56" y2="0" />
          <line x1="65" y1="0" x2="56" y2="0" />
        </g>
        
        <!-- Cardinal Labels -->
        <text x="0" y="-42" fill="#fef08a" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">N</text>

        <!-- Compass Points (8-Point Star) -->
        <!-- Secondary Points (NE, NW, SE, SW) -->
        <g opacity="0.75">
          <polygon points="0,0 12,-12 35,-35" fill="#ca8a04" />
          <polygon points="0,0 35,-35 12,-12" fill="#854d0e" />
          <polygon points="0,0 -12,-12 -35,-35" fill="#ca8a04" />
          <polygon points="0,0 -35,-35 -12,-12" fill="#854d0e" />
          <polygon points="0,0 12,12 35,35" fill="#ca8a04" />
          <polygon points="0,0 35,35 12,12" fill="#854d0e" />
          <polygon points="0,0 -12,12 -35,35" fill="#ca8a04" />
          <polygon points="0,0 -35,35 -12,12" fill="#854d0e" />
        </g>

        <!-- Primary Points (N, S, E, W) -->
        <!-- North Point (Cyan Glow Accent) -->
        <polygon points="0,0 -14,0 0,-52" fill="#38bdf8" />
        <polygon points="0,0 14,0 0,-52" fill="#0284c7" />

        <!-- South Point -->
        <polygon points="0,0 -14,0 0,52" fill="#eab308" />
        <polygon points="0,0 14,0 0,52" fill="#ca8a04" />

        <!-- East Point -->
        <polygon points="0,0 0,-14 52,0" fill="#eab308" />
        <polygon points="0,0 0,14 52,0" fill="#ca8a04" />

        <!-- West Point -->
        <polygon points="0,0 0,-14 -52,0" fill="#eab308" />
        <polygon points="0,0 0,14 -52,0" fill="#ca8a04" />

        <!-- Compass Center Bezel -->
        <circle cx="0" cy="0" r="10" fill="url(#shieldMetal)" stroke="#ffffff" stroke-width="2" />
        <circle cx="0" cy="0" r="4" fill="#0f172a" />
      </g>

    </g>

    <!-- LOWER METALLIC CHEVRON GUARD -->
    <path d="M 400 720 L 590 570 L 610 600 L 400 760 L 190 600 L 210 570 Z" 
          fill="url(#shieldMetal)" stroke="#fef08a" stroke-width="2" />
    <path d="M 400 735 L 575 595 L 585 612 L 400 750 L 215 612 L 225 595 Z" 
          fill="#1e293b" opacity="0.7" />

    <!-- TOP SHIELD CREST / NORTH STAR EMBLEM -->
    <g id="top-crest" transform="translate(400, 125)" filter="url(#dropShadow)">
      <!-- Crest Backing Ring -->
      <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="url(#shieldMetal)" stroke-width="4" />
      <!-- North Star Crest -->
      <path d="M 0 -38 L 8 -10 L 38 0 L 8 10 L 0 38 L -8 10 L -38 0 L -8 -10 Z" 
            fill="url(#goldTextGrad)" stroke="#ffffff" stroke-width="1" />
      <path d="M 0 -38 L 4 -8 L 38 0 L 4 8 L 0 38 L -4 8 L -38 0 L -4 -8 Z" 
            fill="#38bdf8" opacity="0.6" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />
    </g>

    <!-- BOTTOM NODE EMBLEMS (COINS / DIALS) -->
    <!-- Left Emblem Node -->
    <g transform="translate(250, 720)" filter="url(#dropShadow)">
      <ellipse cx="0" cy="20" rx="35" ry="12" fill="#78350f" />
      <rect x="-35" y="-10" width="70" height="30" rx="6" fill="url(#shieldMetal)" stroke="#fef08a" stroke-width="1.5" />
      <ellipse cx="0" cy="-10" rx="35" ry="12" fill="#d97706" stroke="#fef08a" stroke-width="1.5" />
      <!-- Route Icon on Node -->
      <path d="M -12 -10 Q 0 -18 12 -10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="-12" cy="-10" r="3" fill="#ffffff" />
      <circle cx="12" cy="-10" r="3" fill="#ffffff" />
    </g>

    <!-- Right Emblem Node -->
    <g transform="translate(550, 720)" filter="url(#dropShadow)">
      <ellipse cx="0" cy="20" rx="35" ry="12" fill="#78350f" />
      <rect x="-35" y="-10" width="70" height="30" rx="6" fill="url(#shieldMetal)" stroke="#fef08a" stroke-width="1.5" />
      <ellipse cx="0" cy="-10" rx="35" ry="12" fill="#d97706" stroke="#fef08a" stroke-width="1.5" />
      <!-- Compass/Pin Icon on Node -->
      <path d="M 0 -18 L 6 -6 L 0 -10 L -6 -6 Z" fill="#ffffff" />
      <circle cx="0" cy="-6" r="3" fill="#ffffff" />
    </g>

  </g>

  <!-- TYPOGRAPHY BRANDING SECTION -->
  <g id="brand-text" text-anchor="middle" filter="url(#dropShadow)">
    <!-- Primary Title: TECHTREK WAYFINDER -->
    <text x="400" y="890" 
          font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="3" 
          fill="url(#goldTextGrad)" 
          stroke="#000000" 
          stroke-width="2">TECHTREK WAYFINDER</text>
    
    <!-- Subtitle: Smart Routes • Memorable Places -->
    <text x="400" y="932" 
          font-family="'Inter', 'system-ui', sans-serif" 
          font-size="20" 
          font-weight="600" 
          letter-spacing="4" 
          fill="#38bdf8">SMART ROUTES • MEMORABLE PLACES</text>
  </g>
</svg>
