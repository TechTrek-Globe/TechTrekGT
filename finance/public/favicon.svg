<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="fin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06241b" />
      <stop offset="50%" stop-color="#031510" />
      <stop offset="100%" stop-color="#010705" />
    </linearGradient>
    <linearGradient id="fin-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="emerald-f1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="fin-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background rounded squircle tile with glowing emerald border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#fin-bg)" stroke="url(#fin-glow)" stroke-width="5" />
  <circle cx="64" cy="64" r="46" fill="url(#fin-ambient)" />

  <!-- Inner subtle geometric frame -->
  <rect x="14" y="14" width="100" height="100" rx="20" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.3" />

  <!-- Geometric 'F' Monogram -->
  <path d="M 30 34 H 98 V 48 H 48 V 58 H 84 V 72 H 48 V 94 H 30 Z" fill="url(#emerald-f1)" stroke="#064e3b" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="30,34 98,34 94,38 34,38 34,48 30,48" fill="#ffffff" opacity="0.45" />
  <polygon points="48,58 84,58 80,62 48,62" fill="#ffffff" opacity="0.45" />

  <!-- Financial Tech Accent Diamonds -->
  <polygon points="98,58 101,65 98,72 95,65" fill="#6ee7b7" />
  <polygon points="98,80 101,87 98,94 95,87" fill="#6ee7b7" />
  <polygon points="66,80 69,87 66,94 63,87" fill="#6ee7b7" />
</svg>
