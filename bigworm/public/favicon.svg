<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02141f" />
      <stop offset="50%" stop-color="#010d14" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bw-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Base background tile with glowing border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bw-bg)" stroke="url(#bw-glow)" stroke-width="4.5" />

  <!-- Remote Monitor screen frame -->
  <rect x="22" y="26" width="84" height="60" rx="10" fill="url(#screen-grad)" stroke="#22d3ee" stroke-width="2.5" />

  <!-- Monitor stand -->
  <rect x="58" y="86" width="12" height="14" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
  <rect x="44" y="98" width="40" height="6" rx="3" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />

  <!-- Terminal command prompt >_ inside screen -->
  <path d="M 36 46 L 48 56 L 36 66" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="56" y1="66" x2="72" y2="66" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

  <!-- Signal / Wi-Fi dot -->
  <circle cx="92" cy="38" r="3.5" fill="#10b981" />
</svg>
