<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="out-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241604" />
      <stop offset="50%" stop-color="#140d02" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="out-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gavel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Base background tile with glowing border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#out-bg)" stroke="url(#out-glow)" stroke-width="5" />

  <!-- Shield / Banner backing -->
  <path d="M 64 24 L 96 36 L 96 68 C 96 90 64 104 64 104 C 64 104 32 90 32 68 L 32 36 Z" fill="#0f172a" stroke="#d97706" stroke-width="3" stroke-linejoin="round" />

  <!-- Auction Gavel -->
  <!-- Gavel head -->
  <rect x="50" y="40" width="28" height="16" rx="4" transform="rotate(-35 64 48)" fill="url(#gavel-grad)" stroke="#78350f" stroke-width="2" />
  <!-- Gavel handle -->
  <rect x="61" y="48" width="6.5" height="36" rx="3" transform="rotate(-35 64 66)" fill="#fde68a" stroke="#78350f" stroke-width="1.8" />
  <!-- Base sound block -->
  <ellipse cx="64" cy="90" rx="20" ry="7" fill="#451a03" stroke="#f59e0b" stroke-width="2.5" />

  <!-- Accent stars -->
  <polygon points="44,38 46,43 51,43 47,46 49,51 44,48 40,51 42,46 38,43 43,43" fill="#fbbf24" />
  <polygon points="84,38 86,43 91,43 87,46 89,51 84,48 80,51 82,46 78,43 83,43" fill="#fbbf24" />
</svg>
