<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="tt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#070d1e" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="tt-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="tt-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base background tile with glowing border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tt-bg)" stroke="url(#tt-glow)" stroke-width="4.5" />
  <circle cx="64" cy="64" r="42" fill="url(#tt-core)" />

  <!-- Globe outer circle -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Latitude lines -->
  <path d="M 30 50 Q 64 60 98 50" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 30 78 Q 64 68 98 78" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="26" y1="64" x2="102" y2="64" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />

  <!-- Longitude lines -->
  <ellipse cx="64" cy="64" rx="22" ry="38" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="64" y1="26" x2="64" y2="102" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" />

  <!-- Orbiting pulse node -->
  <circle cx="95" cy="42" r="4.5" fill="#38bdf8" />
  <circle cx="95" cy="42" r="7.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
</svg>
