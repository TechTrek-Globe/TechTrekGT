<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="out-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1404" />
      <stop offset="50%" stop-color="#120c02" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="out-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gavel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Base background tile with glowing border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#out-bg)" stroke="url(#out-glow)" stroke-width="4.5" />

  <!-- Shield / Banner backing -->
  <path d="M 64 26 L 94 38 L 94 68 C 94 88 64 102 64 102 C 64 102 34 88 34 68 L 34 38 Z" fill="#0f172a" stroke="#d97706" stroke-width="2.5" />

  <!-- Auction Gavel / Outpost Star Emblem -->
  <!-- Gavel head -->
  <rect x="52" y="42" width="24" height="14" rx="4" transform="rotate(-35 64 49)" fill="url(#gavel-grad)" stroke="#78350f" stroke-width="1.5" />
  <!-- Gavel handle -->
  <rect x="61" y="49" width="6" height="34" rx="3" transform="rotate(-35 64 66)" fill="#fde68a" stroke="#78350f" stroke-width="1.5" />
  <!-- Base sound block -->
  <ellipse cx="64" cy="88" rx="18" ry="6" fill="#451a03" stroke="#f59e0b" stroke-width="2" />

  <!-- Accent stars -->
  <polygon points="46,40 48,45 53,45 49,48 51,53 46,50 42,53 44,48 40,45 45,45" fill="#fbbf24" />
  <polygon points="82,40 84,45 89,45 85,48 87,53 82,50 78,53 80,48 76,45 81,45" fill="#fbbf24" />
</svg>
