<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="tt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1409" />
      <stop offset="50%" stop-color="#0f0c05" />
      <stop offset="100%" stop-color="#040301" />
    </linearGradient>
    <linearGradient id="tt-gold-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="gold-t1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gold-t2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="tt-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background rounded squircle tile with glowing gold border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tt-bg)" stroke="url(#tt-gold-glow)" stroke-width="5" />
  <circle cx="64" cy="64" r="46" fill="url(#tt-ambient)" />

  <!-- Inner subtle geometric frame -->
  <rect x="14" y="14" width="100" height="100" rx="20" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />

  <!-- Left 'T' -->
  <path d="M 22 34 H 60 V 48 H 48 V 94 H 34 V 48 H 22 Z" fill="url(#gold-t1)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="22,34 60,34 56,38 26,38 26,48 22,48" fill="#ffffff" opacity="0.45" />

  <!-- Right 'T' -->
  <path d="M 68 34 H 106 V 48 H 94 V 94 H 80 V 48 H 68 Z" fill="url(#gold-t2)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="68,34 106,34 102,38 72,38 72,48 68,48" fill="#ffffff" opacity="0.45" />

  <!-- Monogram Tech Accent Diamonds -->
  <polygon points="64,34 67,41 64,48 61,41" fill="#fde68a" />
  <polygon points="64,80 67,87 64,94 61,87" fill="#fde68a" />
</svg>
