<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="fin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06192a" />
      <stop offset="50%" stop-color="#031120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="fin-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Base background tile with glowing border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#fin-bg)" stroke="url(#fin-glow)" stroke-width="4.5" />

  <!-- Credit Card / Ledger Outline -->
  <rect x="22" y="32" width="84" height="64" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Magnetic / accent stripe -->
  <rect x="22" y="44" width="84" height="12" fill="#0284c7" fill-opacity="0.6" />

  <!-- Smart chip -->
  <rect x="32" y="64" width="14" height="12" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1" />

  <!-- Ledger sparkline / trend -->
  <path d="M 54 74 L 66 66 L 76 72 L 94 58" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="86 58 94 58 94 66" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
